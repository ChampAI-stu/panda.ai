<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="keywords" content="viraput chaupratoom, portfolio, machine learning engineer, ai engineer">
<meta name="description" content="Portfolio of Viraput Chaupratoom — Machine Learning & AI Engineer.">
<title>Resume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--acc:#ffb020;--acc2:#c6f24e;--bg:#0a0a0c;--card:#070a12;--dark:#05070d;--input:#0d1220}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:#e8ecf5;font-family:"Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",monospace}
a{color:var(--acc);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.grid-bg{background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:40px 40px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;font-weight:600;font-size:12.5px}
.btn-p{background:var(--acc);color:#0a0a0c}
.btn-o{border:1px solid rgba(255,255,255,.18);color:#e8ecf5}

/* top */
.bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;max-width:1040px;margin:0 auto;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:18px;height:18px;background:var(--acc);clip-path:polygon(0 0,100% 0,100% 70%,70% 100%,0 100%)}
.brand span{font-weight:700;font-size:13px;color:#e8ecf5}
.topright{display:flex;align-items:center;gap:8px}
.switch{display:flex;gap:8px}
.switch button{padding:7px 15px;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:11px;border:1px solid rgba(255,255,255,.14);color:#8d97ad;letter-spacing:.06em}
.switch button.on{background:var(--acc);color:#0a0a0c;border-color:var(--acc)}
.editlink{font-family:"JetBrains Mono",monospace;font-size:11px;color:#5c6785;padding:7px 12px;border:1px solid rgba(255,255,255,.1)}
.editlink:hover{color:#8d97ad;border-color:rgba(255,255,255,.2)}

/* states */
.state{max-width:520px;margin:16vh auto;text-align:center;padding:0 24px}
.state .k{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;color:var(--acc2);margin-bottom:14px}
.state h2{font-weight:700;font-size:26px;color:#f2f5fa;margin:0 0 10px;letter-spacing:-.02em}
.state p{color:#8d97ad;font-size:14px;line-height:1.6;margin:0}
.spin{width:26px;height:26px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}

#app{display:none}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.08)}
#particles{position:absolute;inset:0;z-index:0}
.hero .wrap{position:relative;z-index:2;padding-top:56px;padding-bottom:64px;display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center}
.hero .eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;color:var(--acc2);margin-bottom:16px}
.hero h1{margin:0 0 8px;font-weight:700;font-size:clamp(34px,6vw,56px);letter-spacing:-.035em;color:#f2f5fa;line-height:1.02}
.hero h1 .accent{color:var(--acc)}
.hero .typed{font-family:"JetBrains Mono",monospace;font-size:15px;color:#a8b1c4;min-height:22px;margin-bottom:22px}
.hero .typed .cursor{color:var(--acc);animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.hero .otw{display:inline-flex;align-items:center;gap:8px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--acc2);border:1px solid rgba(198,242,78,.3);padding:6px 12px;margin-bottom:26px}
.hero .otw .dot{width:7px;height:7px;border-radius:50%;background:var(--acc2);box-shadow:0 0 8px var(--acc2)}
.socials{display:flex;gap:10px;flex-wrap:wrap}
.socials a{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.14);color:#a8b1c4;transition:.15s}
.socials a:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-2px)}
.socials svg{width:17px;height:17px;fill:currentColor}
.hero .avatarwrap{flex:none}
.hero .heroavatar{width:150px;height:150px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,.16);box-shadow:0 0 0 6px rgba(255,176,32,.06)}

/* document view */
.pdoc{padding:44px 56px 52px;background:var(--card);border:1px solid rgba(255,255,255,.1);margin-bottom:40px}
.pdoc .ph{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:24px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:30px;flex-wrap:wrap;gap:16px}
.pdoc h1{margin:0 0 10px;font-weight:700;font-size:42px;color:#f2f5fa;letter-spacing:-.035em}
.pdoc .role{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--acc)}
.pdoc .bio{margin:0 0 40px;max-width:620px;font-size:15.5px;line-height:1.7;color:#a8b1c4}
.drow{display:grid;grid-template-columns:150px 1fr;gap:36px;padding:24px 0;border-top:1px solid rgba(255,255,255,.08)}
.dlabel{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:10px;color:#5c6785;letter-spacing:.16em;padding-top:3px}
.dentry{margin-bottom:20px}
.dentry:last-child{margin-bottom:0}
.dentry .eh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:12px;flex-wrap:wrap}
.dentry .et{font-weight:600;font-size:16px;color:#e8ecf5}
.dentry .em{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:#5c6785}
.dentry ul{margin:6px 0 0;padding-left:17px;font-size:13.5px;line-height:1.6;color:#8d97ad}
.dentry ul li{margin-bottom:3px}
.dentry .eb{font-size:13.5px;line-height:1.6;color:#8d97ad}
.dskills{display:flex;flex-wrap:wrap;gap:7px}
.dskills span{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid rgba(255,255,255,.14);font-family:"JetBrains Mono",monospace;font-size:12px;color:#a8b1c4}
.dskills span img{width:15px;height:15px;object-fit:contain}
.dwork{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dwork .cell{border:1px solid rgba(255,255,255,.12);background:var(--input);padding:14px}
.dwork .k{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:8.5px;letter-spacing:.1em;margin-bottom:10px}
.dwork .t{font-weight:600;font-size:13.5px;color:#e8ecf5}
.dwork .m{font-family:"JetBrains Mono",monospace;font-size:10px;color:#5c6785;margin-top:5px}
.dwork .cell .cellimg{width:calc(100% + 28px);margin:-14px -14px 12px;height:96px;object-fit:cover;display:block;border-bottom:1px solid rgba(255,255,255,.1)}
.pfoot{margin-top:30px;display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:11px;color:#4a5470;flex-wrap:wrap;gap:8px}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;border:1px solid rgba(255,255,255,.15)}
.dhead-id{display:flex;gap:16px;align-items:center}

/* gallery view */
.gwrap{padding:36px 0 60px}
.ghead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;flex-wrap:wrap;gap:16px}
.ghead h1{margin:0;font-weight:700;font-size:34px;color:#f2f5fa;letter-spacing:-.03em}
.ghead .role{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--acc);margin-top:6px}
.gfilter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.gfilter button{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.05em;color:#8d97ad;border:1px solid rgba(255,255,255,.12);padding:6px 13px}
.gfilter button.on{background:var(--acc);color:#0a0a0c;border-color:var(--acc)}
.gtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.gtile{display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.1);background:var(--card);overflow:hidden}
.gtile .k{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:9px;letter-spacing:.12em;padding:12px 14px 0}
.gtile .box{height:150px;background:var(--input);margin:10px 0 0;overflow:hidden;display:flex;align-items:center;justify-content:center;border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06)}
.gtile .box img{width:100%;height:100%;object-fit:cover}
.gtile .t{font-weight:600;font-size:15px;color:#e8ecf5;padding:14px 14px 0}
.gtile .d{font-size:13px;line-height:1.55;color:#8d97ad;padding:6px 14px 0;flex:1}
.gtile .gfoot{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 14px;margin-top:8px}
.gtile .m{font-family:"JetBrains Mono",monospace;font-size:10px;color:#5c6785}
.gtile .view{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--acc)}
.gtile .view:hover{text-decoration:underline}

/* footer */
.sitefoot{border-top:1px solid rgba(255,255,255,.08);padding:34px 0 44px;margin-top:20px}
.sitefoot .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px}
.sitefoot .info{font-family:"JetBrains Mono",monospace;font-size:12px;color:#8d97ad;line-height:1.7}
.sitefoot .info a{color:#a8b1c4}
.sitefoot .socials a{width:36px;height:36px}
.sitefoot .socials svg{width:15px;height:15px}

@media(max-width:820px){
  .hero .wrap{grid-template-columns:1fr}
  .hero .avatarwrap{order:-1}
  .dwork,.gtiles{grid-template-columns:repeat(2,1fr)}
  .pdoc{padding:32px 22px 40px}
  .drow{grid-template-columns:1fr;gap:12px}
}
@media(max-width:560px){
  .dwork,.gtiles{grid-template-columns:1fr}
}
</style>
</head>
<body class="grid-bg">

<div class="bar">
  <div class="brand"><span class="logo"></span><span id="brandname">portfolio</span></div>
  <div class="topright">
    <div class="switch" id="switch" style="display:none">
      <button data-view="doc" class="on">RESUME</button>
      <button data-view="gallery">WORK</button>
    </div>
    <button class="btn btn-p" id="topPdf" style="display:none;padding:7px 14px;font-size:11px">↓ PDF</button>
    <a class="editlink" href="./edit.html">edit</a>
  </div>
</div>

<!-- loading -->
<div class="state" id="loading">
  <div class="spin"></div>
  <div class="k">LOADING</div>
  <h2>Fetching profile</h2>
  <p>One moment.</p>
</div>

<!-- error -->
<div class="state" id="error" style="display:none">
  <div class="k" style="color:#ff5d5d">ERROR</div>
  <h2>Could not load</h2>
  <p id="errmsg">Something went wrong.</p>
</div>

<div id="app">

  <!-- HERO -->
  <section class="hero">
    <div id="particles"></div>
    <div class="wrap">
      <div class="herocopy">
        <div class="eyebrow" id="h-eyebrow">// PORTFOLIO</div>
        <h1>Hi, I'm <span class="accent" id="h-name">—</span></h1>
        <div class="typed"><span id="h-typed"></span><span class="cursor">▍</span></div>
        <div class="otw" id="h-otw"><span class="dot"></span> OPEN TO WORK</div>
        <div class="socials" id="h-socials"></div>
      </div>
      <div class="avatarwrap">
        <img class="heroavatar" id="h-photo" alt="" style="display:none">
      </div>
    </div>
  </section>

  <div class="wrap">
    <!-- DOCUMENT VIEW -->
    <div id="v-doc">
      <article class="pdoc">
        <div class="ph">
          <div class="dhead-id">
            <img class="avatar" id="d-photo" alt="" style="display:none">
            <div>
              <h1 id="d-name">—</h1>
              <div class="role" id="d-role"></div>
            </div>
          </div>
          <button class="btn btn-o" id="d-pdf">↓ Download PDF</button>
        </div>
        <p class="bio" id="d-bio"></p>
        <div id="d-sections"></div>
        <div class="drow" id="d-skillrow"><div class="dlabel">SKILLS</div><div class="dskills" id="d-skills"></div></div>
        <div class="drow" id="d-workrow" style="display:none"><div class="dlabel">SELECTED WORK</div><div class="dwork" id="d-works"></div></div>
        <div class="pfoot"><span id="d-updated"></span><a id="d-contact" href="#">Get in touch →</a></div>
      </article>
    </div>

    <!-- GALLERY VIEW -->
    <div id="v-gallery" style="display:none">
      <div class="gwrap">
        <div class="ghead">
          <div>
            <h1 id="g-name">Selected Work</h1>
            <div class="role" id="g-role"></div>
          </div>
          <button class="btn btn-o" id="g-pdf">↓ Download résumé</button>
        </div>
        <div class="gfilter" id="g-filter"></div>
        <div class="gtiles" id="g-tiles"></div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="sitefoot">
    <div class="wrap">
      <div class="info" id="f-info"></div>
      <div class="socials" id="f-socials"></div>
    </div>
  </footer>

</div>

<script>
(function(){
  "use strict";
  var SUPABASE_URL  = "https://ynnfniwbpfmsacigiehk.supabase.co";
  var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlubmZuaXdicGZtc2FjaWdpZWhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MzMwNjcsImV4cCI6MjEwMjAwOTA2N30.nEz1tn1ouOW2_ps8e-0IezXtGXhJCDtfxKpUHJJWQ7o";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  var el = function(id){return document.getElementById(id);};
  var esc = function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
  var kindColor = {IMAGE:"#ffb020",CODE:"#c6f24e",AWARD:"#a8b1c4"};
  var RESUME = null;

  /* ---------- social icons ---------- */
  var ICONS = {
    linkedin:'<svg viewBox="0 0 24 24"><path d="M4.98 3.5A2.5 2.5 0 1 0 5 8.5 2.5 2.5 0 0 0 4.98 3.5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.76-2.05C20.4 8.65 21 11 21 14.14V21h-4v-6.1c0-1.45-.03-3.32-2.02-3.32-2.02 0-2.33 1.58-2.33 3.21V21H9z"/></svg>',
    github:'<svg viewBox="0 0 24 24"><path d="M12 1.5A10.5 10.5 0 0 0 8.68 22c.53.1.72-.23.72-.5v-1.8c-2.93.64-3.55-1.26-3.55-1.26-.48-1.22-1.17-1.54-1.17-1.54-.96-.65.07-.64.07-.64 1.06.08 1.62 1.09 1.62 1.09.94 1.62 2.47 1.15 3.07.88.1-.68.37-1.15.67-1.42-2.34-.27-4.8-1.17-4.8-5.2 0-1.15.41-2.09 1.09-2.83-.11-.27-.47-1.35.1-2.8 0 0 .88-.29 2.9 1.08a10 10 0 0 1 5.28 0c2-1.37 2.88-1.08 2.88-1.08.58 1.45.22 2.53.11 2.8.68.74 1.09 1.68 1.09 2.83 0 4.04-2.47 4.93-4.82 5.19.38.33.72.98.72 1.98v2.93c0 .28.19.61.73.5A10.5 10.5 0 0 0 12 1.5z"/></svg>',
    facebook:'<svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/></svg>',

    email:'<svg viewBox="0 0 24 24"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h17A1.5 1.5 0 0 1 22 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 2 18.5zm2.4.5 7.6 5.2L19.6 6zM20 8.1l-7.4 5.06a1 1 0 0 1-1.13 0L4 8.1V18h16z"/></svg>'
  };
  function socialLinks(container, s, email){
    s = s || {};
    var order=[["linkedin",s.linkedin],["github",s.github],["facebook",s.facebook],["instagram",s.instagram],["email",email?"mailto:"+email:""]];
    var html="";
    order.forEach(function(p){
      var key=p[0], url=p[1];
      if(!url) return;
      var href = key==="email"?url:url;
      html += '<a href="'+esc(href)+'" aria-label="'+key+'" target="_blank" rel="noopener">'+ICONS[key]+'</a>';
    });
    el(container).innerHTML = html;
  }

  /* ---------- typing effect ---------- */
  function typer(node, words){
    if(!words.length){ node.textContent=""; return; }
    var wi=0, ci=0, del=false;
    function tick(){
      var w=words[wi];
      node.textContent = del ? w.slice(0,ci-1) : w.slice(0,ci+1);
      ci += del ? -1 : 1;
      var wait=del?45:80;
      if(!del && ci===w.length){ del=true; wait=1400; }
      else if(del && ci===0){ del=false; wi=(wi+1)%words.length; wait=350; }
      setTimeout(tick, wait);
    }
    tick();
  }

  function showError(msg){
    el("loading").style.display="none";
    el("error").style.display="block";
    if(msg) el("errmsg").textContent = msg;
  }

  function render(d){
    RESUME = d;
    document.title = (d.name||"Resume")+" — portfolio";
    el("brandname").textContent = (d.name||"portfolio").split(" ")[0].toLowerCase();

    // hero
    el("h-name").textContent = d.name||"—";
    el("h-photo").style.display = d.photo?"block":"none";
    if(d.photo) el("h-photo").src=d.photo;
    el("h-otw").style.display = d.openToWork===false?"none":"inline-flex";
    var tls = (d.taglines && d.taglines.length) ? d.taglines : [d.role].filter(Boolean);
    if(!tls.length) tls=["Building things."];
    typer(el("h-typed"), tls);
    socialLinks("h-socials", d.socials, d.email);

    // document header
    el("d-name").textContent = d.name||"—";
    el("g-name").textContent = (d.name?d.name+" — ":"")+"Selected Work";
    el("d-role").textContent = d.role ? (d.role + (d.location? " · "+d.location : "")) : (d.location||"");
    el("g-role").textContent = d.role||"";
    el("d-bio").textContent = d.bio||"";
    if(d.photo){ el("d-photo").src=d.photo; el("d-photo").style.display="block"; }
    var mail = d.email ? "mailto:"+d.email : "#";
    el("d-contact").href = mail;
    el("d-updated").textContent = "Updated "+ (d._updated || new Date().toISOString().slice(0,10).replace(/-/g," / "));

    // document sections: experience / education / awards
    var sec = "";
    if(d.experience && d.experience.length){
      sec += '<div class="drow"><div class="dlabel">EXPERIENCE</div><div>'+
        d.experience.map(function(x){
          var from=(x.from||"").replace(/\s*\/\s*\d+$/,"").trim();
          var date = from + (x.to? " — "+x.to : "");
          var hls = (x.highlights||[]).filter(Boolean);
          return '<div class="dentry"><div class="eh"><span class="et">'+esc(x.role)+(x.company?", "+esc(x.company):"")+'</span><span class="em">'+esc(date)+'</span></div>'+
            (hls.length? '<ul>'+hls.map(function(h){return "<li>"+esc(h)+"</li>";}).join("")+'</ul>' : '')+'</div>';
        }).join("")+'</div></div>';
    }
    if(d.education && d.education.length){
      sec += '<div class="drow"><div class="dlabel">EDUCATION</div><div>'+
        d.education.map(function(r){return '<div class="dentry"><div class="eh"><span class="et">'+esc(r.title)+'</span><span class="em">'+esc(r.meta)+'</span></div><div class="eb">'+esc(r.body)+'</div></div>';}).join("")+'</div></div>';
    }
    if(d.awards && d.awards.length){
      sec += '<div class="drow"><div class="dlabel">AWARDS</div><div>'+
        d.awards.map(function(r){return '<div class="dentry"><div class="eh"><span class="et">'+esc(r.title)+'</span><span class="em">'+esc(r.meta)+'</span></div><div class="eb">'+esc(r.body)+'</div></div>';}).join("")+'</div></div>';
    }
    el("d-sections").innerHTML = sec;

    // skills (supports string OR {name,icon})
    var sk = (d.skills||[]);
    el("d-skillrow").style.display = sk.length ? "grid" : "none";
    el("d-skills").innerHTML = sk.map(function(k){
      if(k && typeof k==="object"){ return '<span>'+(k.icon?'<img src="'+esc(k.icon)+'" alt="">':'')+esc(k.name)+'</span>'; }
      return "<span>"+esc(k)+"</span>";
    }).join("");

    // published works only
    var pub = (d.works||[]).filter(function(w){return w.pub;});
    el("d-workrow").style.display = pub.length ? "grid" : "none";
    el("d-works").innerHTML = pub.slice(0,6).map(function(w){
      return '<div class="cell">'+(w.image?'<img class="cellimg" src="'+esc(w.image)+'" alt="">':'')+'<div class="k" style="color:'+(kindColor[w.kind]||"#8d97ad")+'">'+esc(w.kind)+'</div><div class="t">'+esc(w.title)+'</div><div class="m">'+esc(w.date)+'</div></div>';
    }).join("");

    // gallery tiles + filter
    buildGallery(pub);

    // footer
    var info='';
    if(d.email) info+='<a href="mailto:'+esc(d.email)+'">'+esc(d.email)+'</a><br>';
    if(d.location) info+=esc(d.location)+'<br>';
    info+='© '+new Date().getFullYear()+' '+esc(d.name||"");
    el("f-info").innerHTML=info;
    socialLinks("f-socials", d.socials, d.email);

    el("loading").style.display="none";
    el("app").style.display="block";
    el("switch").style.display="flex";
    el("topPdf").style.display="inline-flex";

    // particles
    if(window.particlesJS){
      window.particlesJS("particles",{
        particles:{
          number:{value:55,density:{enable:true,value_area:900}},
          color:{value:"#ffb020"},
          shape:{type:"circle"},
          opacity:{value:.35,random:true},
          size:{value:2.4,random:true},
          line_linked:{enable:true,distance:130,color:"#3a4258",opacity:.5,width:1},
          move:{enable:true,speed:1.1,out_mode:"out"}
        },
        interactivity:{
          detect_on:"canvas",
          events:{onhover:{enable:true,mode:"grab"},onclick:{enable:true,mode:"push"},resize:true},
          modes:{grab:{distance:150,line_linked:{opacity:.8}},push:{particles_nb:3}}
        },
        retina_detect:true
      });
    }
  }

  var galleryData=[];
  function buildGallery(pub){
    galleryData = pub;
    if(!pub.length){ el("g-tiles").innerHTML='<div class="gtile" style="grid-column:1/-1;padding:40px;text-align:center;color:#5c6785">No published work yet.</div>'; el("g-filter").innerHTML=""; return; }
    var kinds = pub.map(function(w){return w.kind||"WORK";});
    var uniq = ["ALL"].concat(kinds.filter(function(v,i){return kinds.indexOf(v)===i;}));
    el("g-filter").innerHTML = uniq.map(function(k,i){return '<button data-k="'+esc(k)+'"'+(i===0?' class="on"':'')+'>'+esc(k)+'</button>';}).join("");
    paintTiles("ALL");
  }
  function paintTiles(filter){
    var rows = filter==="ALL" ? galleryData : galleryData.filter(function(w){return (w.kind||"WORK")===filter;});
    el("g-tiles").innerHTML = rows.map(function(w){
      var view = w.link ? '<a class="view" href="'+esc(w.link)+'" target="_blank" rel="noopener">view →</a>' : '<span></span>';
      return '<div class="gtile"><div class="k" style="color:'+(kindColor[w.kind]||"#8d97ad")+'">'+esc(w.kind)+'</div>'+
        '<div class="box">'+(w.image?'<img src="'+esc(w.image)+'" alt="">':'')+'</div>'+
        '<div class="t">'+esc(w.title)+'</div><div class="d">'+esc(w.desc)+'</div>'+
        '<div class="gfoot">'+view+'<span class="m">'+esc(w.date)+'</span></div></div>';
    }).join("");
  }
  document.addEventListener("click",function(e){
    var f=e.target.closest("#g-filter button");
    if(f){ document.querySelectorAll("#g-filter button").forEach(function(b){b.classList.toggle("on",b===f);}); paintTiles(f.getAttribute("data-k")); }
  });

  // view toggle
  document.querySelectorAll("#switch button").forEach(function(b){
    b.addEventListener("click",function(){
      var v=this.getAttribute("data-view");
      document.querySelectorAll("#switch button").forEach(function(x){x.classList.toggle("on",x===b);});
      el("v-doc").style.display = v==="doc"?"block":"none";
      el("v-gallery").style.display = v==="gallery"?"block":"none";
    });
  });

  /* ---------- PDF export (jsPDF — real text, A4, ATS-readable) ---------- */
  function makePDF(){
    if(!RESUME || !window.jspdf){ return; }
    var d = RESUME;
    var doc = new window.jspdf.jsPDF({unit:"mm", format:"a4"});
    var M=18, X=M, RIGHT=210-M, W=210-M*2, PH=297, y=22;
    var C_DARK=[17,17,20], C_BODY=[55,65,81], C_GRAY=[107,114,128];

    function ensure(h){ if(y+h > PH-M){ doc.addPage(); y=22; } }
    function set(size,style,col){ doc.setFontSize(size); doc.setFont("helvetica",style||"normal"); doc.setTextColor(col[0],col[1],col[2]); }
    function label(t){ ensure(10); y+=3; set(9,"bold",C_DARK); doc.text(String(t).toUpperCase(), X, y); y+=5.5; }
    function wrap(t,size,col,indent,lh){
      indent=indent||0; lh=lh||4.6; set(size,"normal",col);
      var lines=doc.splitTextToSize(String(t), W-indent);
      for(var i=0;i<lines.length;i++){ ensure(lh); doc.text(lines[i], X+indent, y); y+=lh; }
    }

    // header
    set(22,"bold",C_DARK); doc.text((d.name||"").toUpperCase(), X, y); y+=8;
    var sub=[d.role, d.location].filter(Boolean).join("  ·  ");
    if(sub){ set(10,"normal",C_GRAY); doc.text(sub, X, y); y+=5; }
    if(d.email){ set(9,"normal",C_GRAY); doc.text(d.email, X, y); y+=4; }
    y+=2; doc.setDrawColor(17,17,20); doc.setLineWidth(0.5); doc.line(X, y, RIGHT, y); y+=6;

    // experience
    if(d.experience && d.experience.length){
      label("Experience");
      d.experience.forEach(function(x){
        var title=[x.role, x.company].filter(Boolean).join(", ");
        var from=(x.from||"").replace(/\s*\/\s*\d+$/,"").trim();
        var date=from + (x.to? " — "+x.to : "");
        ensure(6);
        set(11,"bold",C_DARK); doc.text(title, X, y);
        set(9,"normal",C_GRAY); doc.text(date, RIGHT, y, {align:"right"});
        y+=5;
        (x.highlights||[]).filter(Boolean).forEach(function(h){
          set(9.5,"normal",C_BODY);
          var lines=doc.splitTextToSize(h, W-4);
          ensure(4.6); doc.text("•", X, y);
          for(var i=0;i<lines.length;i++){ ensure(4.6); doc.text(lines[i], X+4, y); y+=4.6; }
        });
        y+=2.5;
      });
    }
    // education + awards
    [["Education",d.education],["Awards",d.awards]].forEach(function(pair){
      var rows=pair[1]; if(!rows || !rows.length) return;
      label(pair[0]);
      rows.forEach(function(r){
        ensure(6);
        set(11,"bold",C_DARK); doc.text(r.title||"", X, y);
        if(r.meta){ set(9,"normal",C_GRAY); doc.text(r.meta, RIGHT, y, {align:"right"}); }
        y+=5;
        if(r.body){ wrap(r.body, 9.5, C_BODY, 0, 4.6); }
        y+=2.5;
      });
    });
    // skills (string or {name})
    if(d.skills && d.skills.length){
      label("Skills");
      var names=d.skills.map(function(k){return (k&&typeof k==="object")?k.name:k;});
      wrap(names.join("   ·   "), 9.5, C_BODY, 0, 4.8);
    }

    // footer page numbers
    var pages=doc.getNumberOfPages();
    for(var p=1;p<=pages;p++){ doc.setPage(p); set(8,"normal",C_GRAY); doc.text("page "+p+" / "+pages, X, PH-10); }

    var fn=(d.name||"resume").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_+|_+$/g,"")||"resume";
    doc.save(fn+"_resume.pdf");
  }
  ["d-pdf","g-pdf","topPdf"].forEach(function(id){ var b=el(id); if(b) b.addEventListener("click",makePDF); });

  // load
  sb.from("resume").select("data,updated_at").eq("slug","main").single().then(function(res){
    if(res.error){ showError(res.error.message); return; }
    if(!res.data || !res.data.data){ showError("This profile has no data yet."); return; }
    var d = res.data.data;
    if(res.data.updated_at) d._updated = res.data.updated_at.slice(0,10).replace(/-/g," / ");
    try{ render(d); }catch(e){ showError("Could not render this profile."); }
  }).catch(function(e){ showError(e && e.message ? e.message : "Network error."); });
})();
</script>
</body>
</html>
